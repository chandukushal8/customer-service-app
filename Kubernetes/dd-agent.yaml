apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dd-agent
spec:
  selector:
    matchLabels:
      app: dd-agent
  template:
    metadata:
      labels:
        app: dd-agent
    spec:
      containers:
        - name: datadog-agent
          image: datadog/agent:latest
          env:
            - name: DD_API_KEY
              value: "d4d595c26af745b446cb110e470d6081"

            - name: DD_LOGS_ENABLED
              value: "true"

            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: "true"

            - name: DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED
              value: "true"

          volumeMounts:
            - name: passwd
              mountPath: /etc/passwd
              readOnly: true

      volumes:
        - name: passwd
          hostPath:
            path: /etc/passwd
